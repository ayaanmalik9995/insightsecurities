<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Insights | Insight Securities</title>
    <meta name="description" content="Sector and company insights for PSX-listed companies from Insight Securities research: profitability, growth, valuation and balance-sheet strength." />
    <meta name="theme-color" content="#00321A" />
    <link rel="icon" type="image/svg+xml" href="/brand/insight-favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint (light is the default).
      try {
        var t = localStorage.getItem('insights-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <!-- Analytics: Google Tag Manager / GA4 snippet goes here at deployment (no IDs in this build). -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
